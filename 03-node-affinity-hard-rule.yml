apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-affinity-hard-rule
  labels: 
    app: web-app
spec:
  replicas: 2
  selector:
    matchExpressions:
      - key: app
        operator: In
        values:
        - web-app
  template:
    metadata:
      labels:
        app: web-app
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app
                    operator: In
                    values:
                    - nginx
                    - httpd
      containers:
      - image: nginx
        name: nginx
        ports:
        - containerPort: 80