apiVersion: v1
kind: Pod
metadata:
  name: pod-affinity-example-2
  labels:
    app: web-app
spec:
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - nginx
        topologyKey: "kubernetes.io/hostname"
    podAntiAffinity:  
      requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
          - key: app
            operator: In
            values:
            - nginx
        topologyKey: "kubernetes.io/hostname"
  containers:
  - name: python
    image: python:alpine
    command: ["/bin/sh", "-c"]
    args:
      - |
        cat << EOF > /index.html 
        <html>
          <head><title>This is a python App</title></head>
          <body>
            <h1> I'm a Python user </h1>
            <p> Welcome to node-selector-practice </p>
          </body>
        </html>
        EOF
        python3 -m http.server 5678
    ports:
    - name:  python
      containerPort: 5678

---

apiVersion: v1
kind: Service
metadata:
  name: python-svc
spec:
  type: NodePort
  selector:
    app: web-app
  ports:
  - protocol: TCP
    port: 5678
    targetPort: 5678
    nodePort: 31000
